# SSH só com chave. Instalar como /etc/ssh/sshd_config.d/10-ggci.conf (o sshd usa o
# PRIMEIRO valor que encontra, e os arquivos daqui entram antes do sshd_config).
#
# ANTES DE INSTALAR: toda máquina que entra no servidor precisa ter a chave em
# ~/.ssh/authorized_keys do labs. Em 19/11/2026 nove máquinas entravam por senha e só uma
# chave estava cadastrada; instalar sem cadastrar tranca todas elas para fora.
#   Linux:   ssh-copy-id labs@100.105.72.79
#   Windows: type $env:USERPROFILE\.ssh\id_ed25519.pub | ssh labs@100.105.72.79 "cat >> ~/.ssh/authorized_keys"
#   Testar:  ssh -o PasswordAuthentication=no labs@100.105.72.79 echo OK
#
# INSTALAR (mantém as sessões abertas; se o `sshd -t` falhar, nada é recarregado):
#   sudo install -m 644 scripts/ggci-sshd.conf /etc/ssh/sshd_config.d/10-ggci.conf && sudo sshd -t && sudo systemctl reload ssh
# DESFAZER:
#   sudo rm /etc/ssh/sshd_config.d/10-ggci.conf && sudo systemctl reload ssh

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
