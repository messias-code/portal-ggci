# ==============================================================================
# GGCI Portal - Automação Global (Cron)
# ==============================================================================
# COMO ATIVAR/INSTALAR ESSE CRON NO SERVIDOR:
#
# 1. Certifique-se de que o serviço cron está instalado e rodando:
#    sudo apt update && sudo apt install cron -y
#    sudo systemctl enable cron
#    sudo service cron start
#
# 2. Crie o arquivo de log para monitorar as execuções automáticas:
#    touch /home/labs/portal-ggci-prod/cron.log
#    chmod 664 /home/labs/portal-ggci-prod/cron.log
#
# 3. Para ativar este arquivo e configurar a rotina automática no seu Linux,
#    execute o seguinte comando no terminal (dentro da pasta do portal de produção):
#
#    crontab scripts/cron.conf
# Para visualizar/listar se a rotina está rodando ativamente, digite:
#
#    crontab -l
#
# Para parar/remover a rotina (caso precise desativar a automação), digite:
#
#    crontab -r
#
# IMPORTANTE: o crontab guarda uma CÓPIA deste arquivo no momento da instalação.
# Editar as linhas abaixo não muda nada até rodar o comando do passo 3 de novo.
# Foi por isso que mover este arquivo para scripts/ exigiu reinstalar o crontab:
# as linhas ativas ainda apontavam para o caminho antigo do start_server.py.
# ==============================================================================
# Executa o processo de sincronização e subida do servidor:
# 1. Todo dia às 00:01 da manhã (para atualização de ciclo a cada 24h)
# 2. Ao reiniciar a máquina (Quedas de energia, etc)
# ==============================================================================

@reboot /usr/bin/python3 /home/labs/portal-ggci-prod/scripts/start_server.py >> /home/labs/portal-ggci-prod/cron.log 2>&1
1 0 * * * /usr/bin/python3 /home/labs/portal-ggci-prod/scripts/start_server.py >> /home/labs/portal-ggci-prod/cron.log 2>&1
