# EXEMPLOS DE SAÍDA (FEW-SHOT LEARNING)
exemplos_saida:

  riaf_matricula_normalizada_sucesso:
    raciocinio_diagnostico: 'PASSO 1: CPF validado.\nPASSO 2: Documento é um RIAF.\nPASSO 3: Matrícula encontrada RA392-2024 normalizada para 3922024, que bate com o input. Demais campos válidos.'
    matricula_aluno: { conteudo: '3922024', valido: 1 } # Input era RA392-2024, limpo virou 3922024. Sucesso.
    status: { conteudo: 'valido', valido: 1 }

  riaf_curso_equivalente_devolve_nome_do_sistema:
    raciocinio_diagnostico: 'PASSO 3: Curso no documento "Nutricao - Bacharelado". Núcleo NUTRICAO, equivalente ao input "NUTRIÇÃO". Devolvido o nome do input, com acento.'
    curso: { conteudo: 'NUTRIÇÃO', valido: 1 } # Input era NUTRIÇÃO. Nunca 'NUTRICAO' nem 'NUTRICAO - BACHARELADO'.

  riaf_tipo_da_bolsa_so_a_classificacao:
    raciocinio_diagnostico: 'PASSO 3: Tipo da bolsa no documento "Bolsa Parcial". Descartada a palavra "Bolsa", a classificação é PARCIAL.'
    tipo_da_bolsa: { conteudo: 'PARCIAL', valido: 1 } # Nunca 'BOLSA PARCIAL'.

  riaf_tipo_da_bolsa_contradiz_o_input:
    raciocinio_diagnostico: 'PASSO 3: Tipo da bolsa no documento "INTEGRAL"; o Input é PARCIAL. PARCIAL contra INTEGRAL é sempre divergência.'
    tipo_da_bolsa: { conteudo: 'INTEGRAL', valido: 0 }
    inconsistencias: { conteudo: 'Tipo da bolsa diverge da coleta', valido: 0 }
    status: { conteudo: 'invalido', valido: 0 }

  riaf_semestre_em_outro_formato:
    raciocinio_diagnostico: 'PASSO 3: Semestre no documento "20262"; o Input é "2026-2". Ano 2026 e semestre 2 nos dois: mesmo semestre, só o formato muda.'
    semestre: { conteudo: '2026-2', valido: 1 } # Copiado do Input. Nunca 'Semestre diverge da coleta' por formato.

  riaf_nome_de_beneficio_nao_e_comparado:
    raciocinio_diagnostico: 'PASSO 5: Outros benefícios "Desconto Enem", valor 273.66; o Input do valor é 273.66. O nome não tem Input e não é comparado. Valor confere.'
    valor_outros_beneficios: { conteudo: '273.66', valido: 1 }
    nome_outros_beneficios: { conteudo: 'Desconto ENEM', valido: 1 } # Como a IES escreveu, no padrão de escrita. Nunca 'Nome de benefícios diverge da coleta'.

  riaf_beneficios_escalonamento_dinamico_invalido:
    raciocinio_diagnostico: 'PASSO 1-4: Dados iniciais válidos.\nPASSO 5: Outros benefícios encontrado (556.00). O sistema esperava (556.10). Há divergência, campo condicional falha. Status final inválido.'
    valor_outros_beneficios: { conteudo: '556.00', valido: 0 } # Doc tem 556.00, Input era 556.10 = Divergiu
    inconsistencias: { conteudo: 'Benefício é MENOR que a coleta', valido: 0 } # Erro nivel medio disparado
    status: { conteudo: 'invalido', valido: 0 } # Status travado por campo condicional

  riaf_beneficios_ausentes_sucesso:
    raciocinio_diagnostico: 'Benefícios ausentes no documento, soft fail ativado. Todos os outros campos obrigatórios conferem.'
    valor_outros_beneficios: { conteudo: '', valido: 0 } # Não tem no doc = Soft fail silencioso
    nome_outros_beneficios: { conteudo: 'Sem Benefício Informado', valido: 0 } # Doc trazia "Não se aplica". Nunca '', 'N' ou 'NAO SE APLICA'.
    nome_financiamento: { conteudo: 'Sem Financiamento Informado', valido: 0 } # Campo em branco no doc = frase fixa
    inconsistencias: { conteudo: 'Sem inconsistências', valido: 1 } 
    status: { conteudo: 'valido', valido: 1 } # Passou perfeitamente

  riaf_nome_abreviado_nao_trava_status:
    nome_aluno: { conteudo: 'João P Silva', valido: 0 } # Diverge do input JOÃO PEDRO SILVA (Nível Baixo)
    inconsistencias: { conteudo: 'Nome do aluno diverge da coleta', valido: 0 }
    status: { conteudo: 'valido', valido: 1 } # O status global NÃO é afetado por campos desejáveis

  riaf_tipo_invalido:
    raciocinio_diagnostico: 'PASSO 1: CPF confere.\nPASSO 2: O documento anexado é uma "Fatura de Cartão de Crédito", que não é um RIAF. Bloqueio Absoluto acionado. Zera-se o resto.'
    cpf_aluno: { conteudo: '12345678901', valido: 1 }
    matricula_aluno: { conteudo: '', valido: 0 }
    inconsistencias: { conteudo: 'Tipo de Documento inválido', valido: 0 }
    status: { conteudo: 'invalido', valido: 0 }